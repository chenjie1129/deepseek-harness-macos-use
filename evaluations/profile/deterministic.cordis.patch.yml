# Keyless prompt-to-browser smoke. The runner supplies the loopback provider URL.

- id: llm-deepseek
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    baseURL: !!js process.env.DSH_EVAL_PROVIDER_BASE_URL
    thinking: disabled
    reasoningEffort: off
    models:
      - id: deterministic-driver

- id: session-title-llm
  disabled: true

- insert:
    - id: macos-use
      name: '@deepseek-ai/dsh-macos-use'

    - id: browser-use
      name: '@deepseek-ai/dsh-browser-use'

    - id: gui-model
      name: '@deepseek-ai/dsh-gui-model'
      config:
        apiKeyEnv: GUI_MODEL_API_KEY
        baseURL: !!js process.env.DSH_EVAL_PROVIDER_BASE_URL
        model: deterministic-gui-fixture
        maxOutputTokens: 128

    - id: tool-macos-use
      name: '@deepseek-ai/dsh-tool-macos-use'
      config:
        defaultMaxSteps: 3
        taskTimeoutMs: 30000
        showStepScreenshots: true
        browserHeadless: true
        confirmAppleScript: true
        confirmDestructiveActions: true
        singleActiveTask: true
